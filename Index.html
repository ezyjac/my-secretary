<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151c; --surface:#1b202b; --surface-raised:#232a38; --border:#2c3444;
    --text:#ece8e0; --text-dim:#8f96a8;
    --brass:#c9a24b; --coral:#e2725b; --slate:#6b8cae; --sage:#7c9a82; --teal:#5aa39a;
    --font-display:'Fraunces', serif; --font-body:'IBM Plex Sans', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:14px; line-height:1.5; min-height:100vh;}
  #app{display:flex; flex-direction:column; min-height:100vh;}
  .topbar{display:flex; border-bottom:1px solid var(--border); background:var(--surface); overflow-x:auto;}
  .tb-seg{flex:1; min-width:120px; padding:12px 18px; border-right:1px solid var(--border);}
  .tb-seg:last-child{border-right:none;}
  .tb-label{font-size:10px; letter-spacing:0.07em; text-transform:uppercase; color:var(--text-dim); font-weight:500;}
  .tb-value{font-family:var(--font-display); font-size:22px; font-weight:500; margin-top:2px;}
  .tb-value.warn{color:var(--coral);}
  .layout{display:flex; flex:1; min-height:0;}
  .sidebar{width:210px; background:var(--surface); border-right:1px solid var(--border); padding:22px 12px; display:flex; flex-direction:column; gap:4px; flex-shrink:0;}
  .brand{font-family:var(--font-display); font-style:italic; font-size:18px; color:var(--brass); padding:0 10px 20px 10px; border-bottom:1px solid var(--border); margin-bottom:14px; line-height:1.3;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px; color:var(--text-dim); cursor:pointer; font-size:13px; font-weight:500;}
  .nav-item svg{flex-shrink:0; opacity:0.85;}
  .nav-item:hover{background:var(--surface-raised); color:var(--text);}
  .nav-item.active{background:var(--surface-raised); color:var(--brass);}
  .nav-item.active svg{opacity:1;}
  .main{flex:1; overflow-y:auto; padding:28px 36px;}
  .page-title{font-family:var(--font-display); font-size:24px; font-weight:500; margin-bottom:4px;}
  .page-sub{color:var(--text-dim); font-size:13px; margin-bottom:22px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:18px;}
  .section-h{font-family:var(--font-display); font-weight:500; font-size:15px; margin-bottom:10px; color:var(--brass);}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:11px; letter-spacing:0.03em; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px; font-weight:500;}
  .field input, .field select, .field textarea{width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:9px 11px; color:var(--text); font-family:var(--font-body); font-size:13.5px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--brass);}
  .field textarea{resize:vertical; min-height:60px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  .btn{display:inline-flex; align-items:center; gap:7px; background:var(--brass); color:#1a1508; border:none; border-radius:6px; padding:10px 18px; font-family:var(--font-body); font-weight:600; font-size:13px; cursor:pointer;}
  .btn:hover{opacity:.88;} .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-ghost{background:transparent; border:1px solid var(--border); color:var(--text-dim);}
  .btn-ghost:hover{border-color:var(--brass); color:var(--brass);}
  .btn-sm{padding:6px 11px; font-size:12px;}
  .chip-group{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{padding:6px 12px; border-radius:20px; font-size:12.5px; border:1px solid var(--border); color:var(--text-dim); cursor:pointer; user-select:none;}
  .chip.selected{background:var(--brass); border-color:var(--brass); color:#1a1508; font-weight:600;}
  .kw-chip{background:var(--bg); border:1px solid var(--border); padding:4px 10px; border-radius:16px; font-size:12px; color:var(--slate); font-family:var(--font-mono); display:inline-flex; align-items:center; gap:6px;}
  .kw-chip button{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:12px; line-height:1;}
  .output-card{background:var(--surface-raised); border:1px solid var(--border); border-radius:8px; padding:16px; margin-top:12px;}
  .output-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .output-head h4{font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--brass); font-weight:600;}
  .output-body{white-space:pre-wrap; font-size:13.5px; line-height:1.6;}
  .hashtags{display:flex; flex-wrap:wrap; gap:6px;}
  .hashtag{background:var(--bg); border:1px solid var(--border); padding:3px 9px; border-radius:20px; font-size:12px; color:var(--slate); font-family:var(--font-mono);}
  .copy-btn{background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:5px; padding:4px 9px; font-size:11px; cursor:pointer; display:inline-flex; align-items:center; gap:5px;}
  .copy-btn:hover{border-color:var(--brass); color:var(--brass);}
  .loading{display:flex; align-items:center; gap:8px; color:var(--text-dim); font-size:13px; padding:12px 0;}
  .spinner{width:14px; height:14px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--brass); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-box{background:rgba(226,114,91,0.1); border:1px solid var(--coral); color:var(--coral); padding:10px 14px; border-radius:6px; font-size:13px; margin-top:10px;}
  .note-box{background:rgba(107,140,174,0.1); border:1px solid var(--slate); color:var(--slate); padding:10px 14px; border-radius:6px; font-size:12.5px; margin-top:10px;}
  .warn-box{background:rgba(201,162,75,0.1); border:1px solid var(--brass); color:var(--brass); padding:10px 14px; border-radius:6px; font-size:12.5px; margin-top:10px;}
  .platform-tag{font-size:10px; text-transform:uppercase; letter-spacing:.05em; background:var(--teal); color:#0c1a18; padding:2px 8px; border-radius:4px; font-weight:700;}
  .lead-row{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:10px;}
  .lead-row-head{display:flex; justify-content:space-between; align-items:flex-start; cursor:pointer;}
  .lead-name{font-weight:600; font-size:14px;}
  .lead-sub{color:var(--text-dim); font-size:12px; margin-top:2px;}
  .temp-pill{font-size:10px; text-transform:uppercase; padding:3px 9px; border-radius:12px; font-weight:700;}
  .temp-Hot{background:var(--coral); color:#2a0c05;}
  .temp-Warm{background:var(--brass); color:#1a1508;}
  .temp-Cold{background:var(--slate); color:#08131c;}
  .lead-detail{margin-top:12px; padding-top:12px; border-top:1px solid var(--border); display:none;}
  .lead-detail.open{display:block;}
  .resource-item{border-bottom:1px solid var(--border); padding:14px 0;}
  .resource-item:last-child{border-bottom:none;}
  .resource-title{font-weight:600; font-size:14px;}
  .resource-cat{color:var(--teal); font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin-top:2px;}
  .empty-state{text-align:center; padding:50px 20px; color:var(--text-dim);}
  .empty-state svg{opacity:.4; margin-bottom:10px;}
  .tabs-sub{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .tab-sub-btn{padding:7px 14px; border-radius:6px; font-size:12.5px; border:1px solid var(--border); color:var(--text-dim); cursor:pointer; background:transparent;}
  .tab-sub-btn.active{border-color:var(--brass); color:var(--brass); background:rgba(201,162,75,0.08);}
  .overdue-flag{color:var(--coral); font-size:11px; font-weight:700; text-transform:uppercase;}
  ::-webkit-scrollbar{width:9px; height:9px;} ::-webkit-scrollbar-thumb{background:var(--border); border-radius:5px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------------- Icons ---------------- */
const ICONS = {
  sparkle:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>`,
  inbox:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></svg>`,
  book:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>`,
  clock:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`,
  copy:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
  calendar:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
};

/* ---------------- Storage ---------------- */
async function storageGet(key){ try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
async function storageSet(key, value){ try{ await window.storage.set(key, JSON.stringify(value), false); }catch(e){ console.error(e); } }

/* ---------------- Claude API ---------------- */
async function callClaude(system, userMsg, maxTokens=1000, useSearch=false){
  const body = { model:"claude-sonnet-4-6", max_tokens:maxTokens, system, messages:[{role:"user", content:userMsg}] };
  if(useSearch) body.tools = [{type:"web_search_20250305", name:"web_search"}];
  const res = await fetch("https://api.anthropic.com/v1/messages", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
  if(!res.ok) throw new Error("Generation failed. Please try again.");
  const data = await res.json();
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text||"").join("\n").trim();
  if(!text) throw new Error("No response generated.");
  return text;
}
function stripFences(t){ return t.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim(); }

/* ---------------- State ---------------- */
let state = {
  tab:'content', subTab:'', leads:[], resources:[], followups:[], contentHistory:[],
  cg:{ propertyName:'', category:'New Launch', district:'', keyFacts:'', research:'', spotlights:[], keywords:[], platforms:[], output:null },
  loading:{}, openLead:null,
};

const CATEGORIES = ['New Launch','Resale Condominium','Just TOP Condominium','HDB Resale','Executive Condominium','Landed','Rental'];
const SPOTLIGHTS = ['Location & connectivity','MRT convenience','Nearby schools','Family lifestyle','Investment potential','Rental demand','Entry price / psf value','New launch opportunity','Just-TOP move-in ready','Freehold/tenure advantage','Amenities & shopping','First-time homebuyer','HDB upgrader','Downsizer-friendly','Urgent sale / new listing','Open house','Buyer pain point & solution'];
const PLATFORMS = ['TikTok','Instagram','Facebook','Xiaohongshu','YouTube','WhatsApp'];
const SOURCES = ['Instagram DM','TikTok DM','Facebook Messenger','WhatsApp','Xiaohongshu','Property portal','Referral','Other'];
const NEXT_ACTIONS = ['Call lead','Send WhatsApp','Send price list','Confirm eligibility','Arrange viewing','Confirm viewing','Follow up after viewing','Re-engage inactive lead','Close lead'];
const STATUSES = ['New','Contacted','Replied','Qualified','Viewing Booked','Negotiating','Closed Won','Closed Lost'];

function uid(){ return 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString(); }
function fmtDate(d){ const dt=new Date(d); return dt.toLocaleDateString('en-SG',{day:'2-digit',month:'2-digit',year:'numeric'}); }

/* ---------------- Render ---------------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderTopbar()}
    <div class="layout">
      ${renderSidebar()}
      <div class="main">${renderTab()}</div>
    </div>
  `;
  attachHandlers();
}

function renderTopbar(){
  const overdue = state.followups.filter(f=>isOverdue(f)).length;
  const dueToday = state.followups.filter(f=>isDueToday(f)).length;
  const segs = [
    ['Content pieces', state.contentHistory.length],
    ['Leads in inbox', state.leads.length],
    ['Resource entries', state.resources.length],
    ['Due today', dueToday],
    ['Overdue', overdue],
  ];
  return `<div class="topbar">${segs.map(([l,v],i)=>`
    <div class="tb-seg"><div class="tb-label">${l}</div><div class="tb-value ${i===4&&v>0?'warn':''}">${v}</div></div>
  `).join('')}</div>`;
}

function renderSidebar(){
  const items = [
    {key:'content', label:'Content Generator', icon:ICONS.sparkle},
    {key:'inbox', label:'Lead Inbox', icon:ICONS.inbox},
    {key:'library', label:'Resource Library', icon:ICONS.book},
    {key:'followup', label:'Follow-Up Assistant', icon:ICONS.clock},
  ];
  return `<div class="sidebar">
    <div class="brand">SG Property<br>Sales Funnel</div>
    ${items.map(i=>`<div class="nav-item ${state.tab===i.key?'active':''}" data-nav="${i.key}">${i.icon}<span>${i.label}</span></div>`).join('')}
  </div>`;
}

function renderTab(){
  if(state.tab==='content') return renderContentGenerator();
  if(state.tab==='inbox') return renderLeadInbox();
  if(state.tab==='library') return renderLibrary();
  if(state.tab==='followup') return renderFollowUp();
}

/* ================= CONTENT GENERATOR ================= */
function renderContentGenerator(){
  const c = state.cg;
  return `
    <div class="page-title">Content Generator</div>
    <div class="page-sub">Enter a property, research it, pick your angle, and generate platform-ready posts.</div>

    <div class="card">
      <div class="section-h">1. Property details</div>
      <div class="row3">
        <div class="field"><label>Property name</label><input id="cg-name" value="${escapeAttr(c.propertyName)}" placeholder="e.g. Thomson Reserve"/></div>
        <div class="field"><label>Category</label><select id="cg-category">${CATEGORIES.map(cat=>`<option ${c.category===cat?'selected':''}>${cat}</option>`).join('')}</select></div>
        <div class="field"><label>District / area</label><input id="cg-district" value="${escapeAttr(c.district)}" placeholder="e.g. District 20, Upper Thomson"/></div>
      </div>
      <div class="field"><label>Known facts (optional — MRT, tenure, developer, price/psf, TOP date, USPs)</label><textarea id="cg-facts">${escapeHtml(c.keyFacts)}</textarea></div>
      <button class="btn" id="cg-research" ${state.loading.research?'disabled':''}>${ICONS.sparkle} Research this property</button>
      ${state.loading.research ? `<div class="loading"><div class="spinner"></div> Searching public sources…</div>` : ''}
      <div id="cg-research-error"></div>
      ${c.research ? `
        <div class="output-card">
          <div class="output-head"><h4>Research summary</h4></div>
          <div class="output-body">${escapeHtml(c.research)}</div>
          <div class="note-box">Review and correct any fact above before generating content — mark anything you can't confirm as "Verification required."</div>
        </div>
      ` : ''}
    </div>

    <div class="card">
      <div class="section-h">2. Content spotlight</div>
      <div class="chip-group">
        ${SPOTLIGHTS.map(s=>`<div class="chip ${c.spotlights.includes(s)?'selected':''}" data-spotlight="${escapeAttr(s)}">${s}</div>`).join('')}
      </div>
    </div>

    <div class="card">
      <div class="section-h">3. Keywords</div>
      <button class="btn btn-ghost btn-sm" id="cg-suggest-kw" ${state.loading.keywords?'disabled':''}>${ICONS.sparkle} Suggest keywords</button>
      ${state.loading.keywords ? `<div class="loading"><div class="spinner"></div> Thinking of keywords…</div>` : ''}
      <div style="margin-top:10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
        ${c.keywords.map(k=>`<span class="kw-chip">${escapeHtml(k)}<button data-remove-kw="${escapeAttr(k)}">✕</button></span>`).join('')}
        <input id="cg-add-kw" placeholder="add keyword + Enter" style="width:140px; background:var(--bg); border:1px solid var(--border); border-radius:16px; padding:4px 10px; color:var(--text); font-size:12px;"/>
      </div>
    </div>

    <div class="card">
      <div class="section-h">4. Target platforms</div>
      <div class="chip-group">
        ${PLATFORMS.map(p=>`<div class="chip ${c.platforms.includes(p)?'selected':''}" data-platform="${p}">${p}</div>`).join('')}
      </div>
      <button class="btn" id="cg-generate" style="margin-top:16px;" ${state.loading.content?'disabled':''}>${ICONS.sparkle} Generate Content</button>
      ${state.loading.content ? `<div class="loading"><div class="spinner"></div> Writing content for ${c.platforms.join(', ')||'selected platforms'}…</div>` : ''}
      <div id="cg-error"></div>
    </div>

    ${c.output ? renderPlatformOutput(c.output) : ''}
    ${state.contentHistory.length>0 ? `
      <div class="card">
        <div class="section-h">Recent content</div>
        ${state.contentHistory.slice(0,5).map(h=>`<div class="resource-item"><div class="resource-title">${escapeHtml(h.propertyName)} — ${h.platforms.join(', ')}</div><div class="resource-cat">${fmtDate(h.createdAt)}</div></div>`).join('')}
      </div>
    ` : ''}
  `;
}

function renderPlatformOutput(output){
  let html = '';
  for(const platform of Object.keys(output)){
    const d = output[platform];
    html += `<div class="card"><div class="section-h"><span class="platform-tag">${platform}</span></div>`;
    if(platform==='tiktok'){
      html += fieldBlock('Hook', d.hook) + fieldBlock('Script', d.script) + fieldBlock('Caption', d.caption) + hashtagBlock(d.hashtags) + fieldBlock('CTA', d.cta);
    } else if(platform==='instagram'){
      html += fieldBlock('Reel script', d.reelScript) + fieldBlock('Caption', d.caption) + hashtagBlock(d.hashtags) + fieldBlock('CTA', d.cta);
    } else if(platform==='facebook'){
      html += fieldBlock('Short post', d.shortPost) + fieldBlock('Detailed post', d.longPost) + fieldBlock('CTA', d.cta);
    } else if(platform==='xiaohongshu'){
      html += fieldBlock('Title', d.title) + fieldBlock('Post (Simplified Chinese)', d.post) + hashtagBlock(d.hashtags);
    } else if(platform==='youtube'){
      html += fieldBlock('Title options', (d.titles||[]).join('\n')) + fieldBlock('Hook', d.hook) + fieldBlock('Description', d.description) + hashtagBlock(d.tags);
    } else if(platform==='whatsapp'){
      html += fieldBlock('Message', d.message);
    }
    html += `<button class="btn btn-ghost btn-sm" data-compliance="${platform}" ${state.loading['compliance-'+platform]?'disabled':''}>Check compliance</button>`;
    if(state.loading['compliance-'+platform]) html += `<div class="loading"><div class="spinner"></div> Checking…</div>`;
    if(state.complianceResults && state.complianceResults[platform]) html += `<div class="warn-box">${escapeHtml(state.complianceResults[platform])}</div>`;
    html += `</div>`;
  }
  return html;
}
function fieldBlock(label, text){
  if(!text) return '';
  return `<div class="output-card"><div class="output-head"><h4>${label}</h4><button class="copy-btn" data-copy="${escapeAttr(text)}">${ICONS.copy} Copy</button></div><div class="output-body">${escapeHtml(text)}</div></div>`;
}
function hashtagBlock(tags){
  if(!tags || !tags.length) return '';
  return `<div class="output-card"><div class="output-head"><h4>Hashtags</h4><button class="copy-btn" data-copy="${escapeAttr(tags.join(' '))}">${ICONS.copy} Copy all</button></div><div class="hashtags">${tags.map(t=>`<span class="hashtag">${escapeHtml(t)}</span>`).join('')}</div></div>`;
}

async function doResearch(){
  const name = document.getElementById('cg-name').value.trim();
  if(!name){ showError('cg-research-error','Enter a property name first.'); return; }
  state.cg.propertyName = name;
  state.cg.category = document.getElementById('cg-category').value;
  state.cg.district = document.getElementById('cg-district').value.trim();
  state.cg.keyFacts = document.getElementById('cg-facts').value.trim();
  state.loading.research = true; render();
  try{
    const system = `You are researching a Singapore property for a real estate agent's marketing content. Use web search to find factual, publicly available details. Organize your answer under short headings: Location & Connectivity, Tenure & Developer, Unit Mix & Pricing (only if publicly listed), Nearby Schools, Nearby Amenities, Sources. For any fact you cannot verify from search results, write "Verification required" instead of guessing. Do not copy long passages from any source — write in your own words. Keep the whole summary under 300 words.`;
    const user = `Property name: ${name}\nCategory: ${state.cg.category}\nDistrict/area: ${state.cg.district||'not specified'}\nAgent-provided facts: ${state.cg.keyFacts||'none provided'}`;
    const research = await callClaude(system, user, 900, true);
    state.cg.research = research;
  }catch(e){ showError('cg-research-error', e.message); }
  state.loading.research = false; render();
}

async function suggestKeywords(){
  const c = state.cg;
  if(!c.propertyName){ document.getElementById('cg-name').focus(); return; }
  state.loading.keywords = true; render();
  try{
    const system = `Suggest 8-12 short SEO/hashtag-style keywords for Singapore property social content. Return ONLY a JSON array of strings, nothing else.`;
    const user = `Property: ${c.propertyName}\nCategory: ${c.category}\nDistrict: ${c.district}\nSpotlights selected: ${c.spotlights.join(', ')||'none yet'}`;
    const raw = await callClaude(system, user, 300);
    const kws = JSON.parse(stripFences(raw));
    c.keywords = Array.from(new Set([...c.keywords, ...kws]));
  }catch(e){}
  state.loading.keywords = false; render();
}

async function generateContent(){
  const c = state.cg;
  if(!c.propertyName){ showError('cg-error','Add a property name first.'); return; }
  if(c.platforms.length===0){ showError('cg-error','Select at least one platform.'); return; }
  state.loading.content = true; state.complianceResults = {}; render();
  try{
    const schemaParts = [];
    if(c.platforms.includes('TikTok')) schemaParts.push(`"tiktok": {"hook": string, "script": string, "caption": string, "hashtags": [string,...8-12 items], "cta": string}`);
    if(c.platforms.includes('Instagram')) schemaParts.push(`"instagram": {"reelScript": string, "caption": string, "hashtags": [string,...8-12 items], "cta": string}`);
    if(c.platforms.includes('Facebook')) schemaParts.push(`"facebook": {"shortPost": string, "longPost": string, "cta": string}`);
    if(c.platforms.includes('Xiaohongshu')) schemaParts.push(`"xiaohongshu": {"title": string, "post": string (Simplified Chinese, natural conversational tone for SG readers, moderate emoji), "hashtags": [string,...5-8 items]}`);
    if(c.platforms.includes('YouTube')) schemaParts.push(`"youtube": {"titles": [string,...3 options], "hook": string, "description": string, "tags": [string,...8-12 items]}`);
    if(c.platforms.includes('WhatsApp')) schemaParts.push(`"whatsapp": {"message": string}`);
    const system = `You are a social content writer for a Singapore property agent. Return ONLY valid JSON, no preamble, no markdown fences. Schema: {${schemaParts.join(', ')}}. Tone: warm, professional, natural Singaporean register, no exaggerated or misleading sales language, no guaranteed-return claims. Use the property facts and spotlight angles given; if a fact is marked "Verification required" do not state it as certain.`;
    const user = `Property: ${c.propertyName}\nCategory: ${c.category}\nDistrict: ${c.district}\nFacts/research: ${c.research || c.keyFacts || 'general facts for this property type'}\nSpotlight angles: ${c.spotlights.join(', ')||'general appeal'}\nKeywords: ${c.keywords.join(', ')||'none specified'}`;
    const raw = await callClaude(system, user, 2000);
    const parsed = JSON.parse(stripFences(raw));
    c.output = parsed;
    state.contentHistory.unshift({ id:uid(), propertyName:c.propertyName, platforms:c.platforms.slice(), output:parsed, createdAt:todayISO() });
    await storageSet('content-history', state.contentHistory);
  }catch(e){ showError('cg-error', e.message); }
  state.loading.content = false; render();
}

async function checkCompliance(platform){
  const d = state.cg.output[platform];
  state.loading['compliance-'+platform] = true; render();
  try{
    const system = `You are a lightweight advertising-compliance reviewer for Singapore property marketing content. Flag (in 2-4 short bullet points): unsupported/guaranteed-return claims, unverified prices, misleading urgency, discriminatory wording, or missing agent CTA/identification. If none found, say "No issues flagged — agent should still verify against current CEA/URA/HDB/PDPA requirements before posting." Keep it brief.`;
    const text = JSON.stringify(d);
    const result = await callClaude(system, text, 300);
    state.complianceResults = state.complianceResults || {};
    state.complianceResults[platform] = result;
  }catch(e){}
  state.loading['compliance-'+platform] = false; render();
}

function handleCsvImport(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    const lines = e.target.result.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length < 2){ return; }
    const headers = lines[0].split(',').map(h=>h.trim());
    let imported = 0;
    for(let i=1;i<lines.length;i++){
      const cols = lines[i].split(',').map(c=>c.trim());
      const row = {}; headers.forEach((h,idx)=>row[h]=cols[idx]||'');
      if(!row.name) continue;
      state.leads.unshift({
        id: uid(), name: row.name, contact: row.contact||'', source: row.source||'Other',
        propertyInterest: row.propertyInterest||'', role: row.role||'', question: row.question||'',
        temperature:'Warm', aiAnswer:'', createdAt: todayISO(),
      });
      imported++;
    }
    await storageSet('leads', state.leads);
    document.getElementById('li-csv-result').innerHTML = `<div class="note-box">Imported ${imported} lead(s).</div>`;
    render();
  };
  reader.readAsText(file);
}

function isOverdue(f){ if(!f.followUpDate) return false; const dt = new Date(f.followUpDate+'T'+(f.followUpTime||'23:59')); return dt < new Date() && f.status!=='Closed Won' && f.status!=='Closed Lost'; }
function isDueToday(f){ if(!f.followUpDate) return false; const today = new Date().toISOString().slice(0,10); return f.followUpDate === today; }

  const sub = state.subTab || 'all';

  return `

    <div class="page-sub">Answered leads land here. Set a real reminder — download the .ics to your phone calendar for a dependable alert.</div>

function downloadIcs(id){
  const f = state.followups.find(x=>x.id===id); if(!f || !f.followUpDate) { return; }
  const time = f.followUpTime || '09:00';
  const dt = new Date(f.followUpDate+'T'+time+':00');
  const pad = n => String(n).padStart(2,'0');
  const stamp = `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`;
  const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nUID:${f.id}@sgpropertyfunnel\nDTSTAMP:${stamp}\nDTSTART:${stamp}\nSUMMARY:Follow up with ${f.name}\nDESCRIPTION:${(f.nextAction||'Follow up')} — ${(f.propertyInterest||'')}\nEND:VEVENT\nEND:VCALENDAR`;
  const blob = new Blob([ics], {type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `followup-${f.name.replace(/\s+/g,'-')}.ics`;
  a.click();
}

async function generateFollowUpMessage(id){
  const f = state.followups.find(x=>x.id===id); if(!f) return;
  state.loading['fumsg-'+id] = true; render();
  try{
    const system = `Draft a short WhatsApp follow-up message for a Singapore property agent to send this lead, based on their next action and status. Natural, warm, not pushy, under 4 sentences. Return only the message.`;
    const user = `Lead: ${f.name}\nProperty: ${f.propertyInterest||'not specified'}\nNext action: ${f.nextAction}\nStatus: ${f.status}\nNotes: ${f.notes||'none'}`;
    f._message = await callClaude(system, user, 350);
  }catch(e){}
  state.loading['fumsg-'+id] = false; render();
}

function escapeAttr(s){ return escapeHtml(s).replace(/\n/g,'&#10;'); }

    el.onclick = () => { const s=el.getAttribute('data-spotlight'); const i=state.cg.spotlights.indexOf(s); if(i>-1) state.cg.spotlights.splice(i,1); else state.cg.spotlights.push(s); render(); };
  });
  document.querySelectorAll('[data-platform]').forEach(el=>{
    el.onclick = () => { const p=el.getAttribute('data-platform'); const i=state.cg.platforms.indexOf(p); if(i>-1) state.cg.platforms.splice(i,1); else state.cg.platforms.push(p); render(); };
  });
  const kwBtn = document.getElementById('cg-suggest-kw'); if(kwBtn) kwBtn.onclick = suggestKeywords;
  document.querySelectorAll('[data-remove-kw]').forEach(el=>{ el.onclick=()=>{ state.cg.keywords = state.cg.keywords.filter(k=>k!==el.getAttribute('data-remove-kw')); render(); }; });
  const addKwInput = document.getElementById('cg-add-kw');
  if(addKwInput) addKwInput.onkeydown = (e) => { if(e.key==='Enter' && addKwInput.value.trim()){ state.cg.keywords.push(addKwInput.value.trim()); render(); } };
  const genBtn = document.getElementById('cg-generate'); if(genBtn) genBtn.onclick = generateContent;
  document.querySelectorAll('[data-compliance]').forEach(el=>{ el.onclick=()=>checkCompliance(el.getAttribute('data-compliance')); });

  const liAdd = document.getElementById('li-add'); if(liAdd) liAdd.onclick = addLead;
  const csvInput = document.getElementById('li-csv'); if(csvInput) csvInput.onchange = (e)=>{ if(e.target.files[0]) handleCsvImport(e.target.files[0]); };
  document.querySelectorAll('[data-toggle-lead]').forEach(el=>{ el.onclick=()=>{ const id=el.getAttribute('data-toggle-lead'); state.openLead = state.openLead===id?null:id; render(); }; });
  document.querySelectorAll('[data-gen-answer]').forEach(el=>{ el.onclick=()=>generateAnswer(el.getAttribute('data-gen-answer')); });
  document.querySelectorAll('[data-save-resource]').forEach(el=>{ el.onclick=()=>saveToResource(el.getAttribute('data-save-resource')); });
  document.querySelectorAll('[data-move-followup]').forEach(el=>{ el.onclick=()=>moveToFollowUp(el.getAttribute('data-move-followup')); });

  const libAdd = document.getElementById('lib-add'); if(libAdd) libAdd.onclick = addResource;
  const libSearch = document.getElementById('lib-search');
  if(libSearch) libSearch.oninput = () => {
    const q = libSearch.value.toLowerCase();
    const filtered = state.resources.filter(r => (r.title+r.category+(r.tags||[]).join(' ')+r.question).toLowerCase().includes(q));
    document.getElementById('lib-list').innerHTML = renderResourceList(filtered);
    document.querySelectorAll('#lib-list [data-copy]').forEach(el=>attachCopy(el));
  };

  document.querySelectorAll('[data-fu-save]').forEach(el=>{ el.onclick=()=>saveFollowUp(el.getAttribute('data-fu-save')); });
  document.querySelectorAll('[data-fu-ics]').forEach(el=>{ el.onclick=()=>downloadIcs(el.getAttribute('data-fu-ics')); });
  document.querySelectorAll('[data-fu-message]').forEach(el=>{ el.onclick=()=>generateFollowUpMessage(el.getAttribute('data-fu-message')); });

  document.querySelectorAll('[data-copy]').forEach(attachCopy);
}
function attachCopy(el){
  el.onclick = async () => {
    const text = el.getAttribute('data-copy').replace(/&#10;/g,'\n').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
    try{ await navigator.clipboard.writeText(text); const orig = el.innerHTML; el.innerHTML='Copied ✓'; setTimeout(()=>{el.innerHTML=orig;},1300); }catch(e){}
  };
}

/* ---------------- Init ---------------- */
async function init(){
  const [leads, resources, followups, history] = await Promise.all([
    storageGet('leads'), storageGet('resources'), storageGet('followups'), storageGet('content-history')
  ]);
  state.leads = leads || [];
  state.resources = resources || seedResources();
  if(!resources) await storageSet('resources', state.resources);
  state.followups = followups || [];
  state.contentHistory = history || [];
  render();
}
init();
</script>
